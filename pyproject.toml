[project]
name = "customer-support-agent"
version = "0.1.0"
description = ""
authors = [
    {name = "prechy",email = "preciousrobinsonokafor@gmail.com"}
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "rank-bm25 (>=0.2.2,<0.3.0)",
    "snowballstemmer (>=3.1.1,<4.0.0)"
]

# Terminal commands: `name = "module.path:function"`.
# After `poetry install`, run with `poetry run <name>` (or just `<name>` inside `poetry shell`/activated env).
[project.scripts]
support-agent = "customer_support_agent.main:main"

[tool.poetry]
packages = [{ include = "customer_support_agent", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.12,<3.13"


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)"
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
